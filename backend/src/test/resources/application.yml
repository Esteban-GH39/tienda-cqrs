# Configuración SOLO para pruebas: H2 en modo PostgreSQL, sin Kafka ni RabbitMQ
spring:
  datasource:
    url: jdbc:h2:mem:tienda;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
app:
  kafka:
    topic: pedidos.eventos
