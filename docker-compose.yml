# Todo el proyecto con Docker.
#   COMANDOS (escribir)  -> PostgreSQL en Supabase (nube)
#   CONSULTAS (leer)     -> MongoDB (contenedor "mongo")
#
#   Solo Kafka + RabbitMQ + MongoDB (servidor y clientes los corres tú desde IntelliJ / ng serve):
#       docker compose up -d
#
#   TODO (Kafka + RabbitMQ + MongoDB + servidor + Tienda + Panel). Requiere el archivo .env (copia .env.example):
#       docker compose --profile app up -d --build
#       Tienda: http://localhost:4200   Panel: http://localhost:4201   RabbitMQ: http://localhost:15672
#
# Si ya tienes RabbitMQ instalado en Windows (puerto 5672), no uses el servicio "rabbitmq" de aquí.
services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"          # para el servidor que corres fuera de Docker (localhost:9092)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT = dentro de la red de Docker (kafka:19092); EXTERNAL = desde tu PC (localhost:9092)
      KAFKA_LISTENERS: PLAINTEXT://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"          # AMQP
      - "15672:15672"        # panel web (guest / guest)

  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"        # MongoDB: lado de CONSULTAS
    volumes:
      - mongo-datos:/data/db

  # ---------------- Aplicación (perfil "app") ----------------
  backend:
    profiles: ["app"]
    build: ./backend
    container_name: tienda-backend
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP: kafka:19092      # dentro de Docker se usa el nombre del servicio
      RABBIT_HOST: rabbitmq
      MONGO_URI: mongodb://mongo:27017/tienda
    depends_on:
      - kafka
      - rabbitmq
      - mongo
    restart: on-failure
    ports:
      - "8080:8080"

  tienda:
    profiles: ["app"]
    build:
      context: ./frontend
      args:
        APP: tienda
        API_URL: http://localhost:8080
    container_name: tienda-cliente
    ports:
      - "4200:80"

  admin:
    profiles: ["app"]
    build:
      context: ./frontend
      args:
        APP: admin
        API_URL: http://localhost:8080
    container_name: panel-admin
    ports:
      - "4201:80"

volumes:
  mongo-datos:
