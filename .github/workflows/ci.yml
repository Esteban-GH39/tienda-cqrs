name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Servidor (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Compilar y probar (H2 en modo PostgreSQL, sin Kafka ni RabbitMQ)
        run: mvn -B verify
        working-directory: backend

  frontend:
    name: Clientes (Angular)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [tienda, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: npx ng build ${{ matrix.app }}
        working-directory: frontend
